<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Choose Your Role</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
            color: white;
            font-family: 'Arial', sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-container {
            display: flex;
            gap: 2rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .card {
            width: 300px;
            border-radius: 15px;
            background: white;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            text-align: center;
            padding: 20px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }
        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.3);
        }
        .card i {
            font-size: 60px;
            color: #28a745;
            margin-bottom: 20px;
        }
        .card h2 {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
        .card p {
            font-size: 16px;
            color: #666;
        }
        .card a {
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #28a745;
            color: white;
            font-weight: bold;
            border-radius: 8px;
            transition: background-color 0.3s ease;
        }
        .card a:hover {
            background: #1e7e34;
        }
        @media (max-width: 768px) {
            .card {
                width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="container text-center">
        <h1 class="mb-5" style="font-size: 36px; font-weight: bold;">Register As</h1>
        <div class="card-container">
            <!-- Job Seeker Card -->
            <div class="card">

                <i class="fas fa-user-plus"></i>
                <h2>Job Seeker</h2>
                <p>Create your profile and explore opportunities that align with your career path.</p>
                <a href="{%url 'jobseeker_register' %}">Register as Job Seeker</a>
            </div>
            <!-- Job Provider Card -->
            <div class="card">
                <i class="fas fa-building"></i>
                <h2>Job Provider</h2>
                <p>Sign up to post jobs and discover talented professionals for your organization.</p>
                <a href="{%url 'jobprovider_register' %}">Register as Job Provider</a>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
