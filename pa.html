<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .post-button {
            display: flex;
            justify-content: center;
            margin: 40px 0 20px; /* Added margin to push it lower */
        }

        .post-button button {
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .post-button button:hover {
            background-color: #0056b3;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: 20px 0;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }

        .job-table {
            width: 100%;
            border-collapse: collapse;
        }

        .job-table th, .job-table td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        .job-table th {
            background-color: #007BFF;
            color: white;
        }

        .job-table tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .job-table tr:hover {
            background-color: #f1f1f1;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .action-buttons button {
            padding: 5px 10px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .apply-button {
            background-color: #28a745;
            color: white;
        }

        .apply-button:hover {
            background-color: #218838;
        }

        .more-options-button {
            background-color: #ffc107;
            color: white;
        }

        .more-options-button:hover {
            background-color: #e0a800;
        }
    </style>
</head>
<body>

    <!-- Post a Job Button -->
    <div class="post-button">
        <button onclick="location.href='/post-job'">Post a Job</button>
    </div>

    <!-- Job Listings -->
    <div class="container">
        <table class="job-table">
            <thead>
                <tr>
                    <th>Company Name</th>
                    <th>Description</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Example Company</td>
                    <td>Looking for a software developer to join our team.</td>
                    <td>
                        <div class="action-buttons">
                            <button class="apply-button">Apply</button>
                            <button class="more-options-button">More</button>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td>Another Company</td>
                    <td>Seeking a project manager with 5 years of experience.</td>
                    <td>
                        <div class="action-buttons">
                            <button class="apply-button">Apply</button>
                            <button class="more-options-button">More</button>
                        </div>
                    </td>
                </tr>
                <!-- Additional rows can be added here -->
            </tbody>
        </table>
    </div>

</body>
</html>
