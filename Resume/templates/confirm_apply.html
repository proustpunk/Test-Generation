<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ job.title }} - Job Details</title>
    <script>
        function confirmApplication(event) {
            const userConfirmed = confirm("Are you sure you want to apply for this job?");
            if (!userConfirmed) {
                event.preventDefault();
            }
        }
    </script>
</head>
<body>
    <h1>{{ job.title }}</h1>
    <p><strong>Company:</strong> {{ job.company_name }}</p>
    <p><strong>Location:</strong> {{ job.job_location }}</p>
    <p><strong>Salary:</strong> {{ job.salary_range }}</p>
    <p><strong>Description:</strong> {{ job.job_description }}</p>

    <div>
        {% if has_applied %}
            <p>You have already applied for this job.</p>
        {% else %}
            <form action="{% url 'apply_job' job.id %}" method="post" onsubmit="confirmApplication(event)">
                {% csrf_token %}
                <button type="submit">Apply Now</button>
            </form>
        {% endif %}
        <a href="{% url 'joblist' %}">Back to Job List</a>
    </div>
</body>
</html>
